name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main", "master", "sesi30-devsecops" ]
  pull_request:
    branches: [ "main", "master", "sesi30-devsecops" ]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: 1. Unit Test (Pytest)
        run: |
          PYTHONPATH=. pytest

      - name: 2. SAST (Bandit)
        run: |
          bandit -r app/ -ll

      - name: 3. SCA (pip-audit)
        run: |
          pip-audit -r requirements.txt --ignore-vuln GHSA-2g95-wg33-c5x2 --ignore-vuln GHSA-v4x8-3wr5-3wq8 --ignore-vuln GHSA-crv4-6mhj-j5jh --ignore-vuln GHSA-9vhv-jxww-xfm5 --ignore-vuln GHSA-jqc4-5cvw-7w85 --ignore-vuln GHSA-567q-5qvw-pf92 --ignore-vuln GHSA-m462-7rxw-wvpg --ignore-vuln GHSA-8mx5-7m5m-r77g --ignore-vuln GHSA-fj95-fr6c-h845 --ignore-vuln GHSA-69hj-f68j-2879 --ignore-vuln GHSA-9c4x-gm8v-wgc4 --ignore-vuln GHSA-rfpc-qcw5-3pc4 --ignore-vuln GHSA-cwqr-hh33-gh44 --ignore-vuln GHSA-fq56-3cx3-fjxp --ignore-vuln GHSA-9j6q-wvj5-jgjg --ignore-vuln GHSA-6627-m3xw-93mp --ignore-vuln GHSA-wfhq-q4j2-c37m

      - name: 4. Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  build-and-push:
    needs: test-and-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/notes-app
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
